name: LiftLog
options:
  deploymentTarget:
    iOS: "17.0"
    watchOS: "8.0"
  createIntermediateGroups: true
settings:
  base:
    # Change this to something unique to you, e.g. com.yourname.liftlog
    APP_BUNDLE_ID: com.example.liftlog
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: NO
targets:
  LiftLog:
    type: application
    platform: iOS
    sources:
      - Phone
      - Shared
    info:
      path: Phone/Info.plist
      properties:
        CFBundleDisplayName: LiftLog
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: LiftLogWatch
  LiftLogWatch:
    type: application
    platform: watchOS
    sources:
      - Watch
      - Shared
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: LiftLog
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: $(APP_BUNDLE_ID)
        WKBackgroundModes:
          - workout-processing
        NSHealthShareUsageDescription: LiftLog reads heart rate and calories during your workout so they are included in the saved workout.
        NSHealthUpdateUsageDescription: LiftLog saves your strength workouts to Apple Health.
    entitlements:
      path: Watch/LiftLogWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
